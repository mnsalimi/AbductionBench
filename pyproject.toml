[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "abductionbench"
version = "0.1.0"
description = "A configurable evaluation framework for abductive reasoning benchmarks."
requires-python = ">=3.10"
readme = "README.md"
dependencies = [
  "pydantic>=2.7",
  "PyYAML>=6.0",
  "httpx>=0.27",
  "tenacity>=8.2",
  "Jinja2>=3.1",
  "rich>=13.7",
  "typer>=0.12",
  "pandas>=2.2",
  "XlsxWriter>=3.2",
  "openpyxl>=3.1",
  "orjson>=3.10",
  "filelock>=3.14",
  "tiktoken>=0.7",
]

[project.optional-dependencies]
adapters = ["requests>=2.32", "datasets>=2.19", "huggingface_hub>=0.23"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.5"]

[project.scripts]
abench = "abductionbench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]
