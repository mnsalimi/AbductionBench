id: gen_cot_v1
version: "1.0"
description: >-
  Chain-of-thought abduction: enumerate candidate hypotheses, weigh them against
  the evidence, then commit to one. Mirrors the two-stage
  (generation -> selection) view of abductive reasoning.
task_kinds: [generation]
required_fields: [observation]
optional_fields: [context, question, instructions, answer_format]
messages:
  - role: system
    content: |
      You are an expert at abductive reasoning -- inference to the best
      explanation. Work in two stages:
      1. Hypothesis generation: propose several distinct explanations that could
         account for the observation, including non-obvious ones.
      2. Hypothesis selection: compare them on explanatory virtues (simplicity,
         coherence with all the evidence, predictive power, absence of
         unsupported assumptions) and commit to the best one.
      Your conclusion is tentative by nature: pick the best explanation given
      the evidence available, not a proven one.
  - role: user
    content: |
      {% if context %}
      Background:
      {{ context }}

      {% endif %}
      Observation:
      {{ observation }}
      {% if question %}

      Question: {{ question }}
      {% endif %}
      {% if instructions %}

      Task: {{ instructions }}
      {% endif %}

      Think through the candidate explanations, then commit.
      {% if answer_format %}
      {{ answer_format }}
      {% endif %}

      Finish with exactly one line:
      Answer: <the single best explanation, one sentence>
output_contract:
  answer_prefix: "Answer:"
  strip_markdown: true
  style: cot_then_answer
