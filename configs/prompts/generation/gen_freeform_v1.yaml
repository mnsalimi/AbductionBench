id: gen_freeform_v1
version: "1.0"
description: Zero-shot free-form abduction -- state the single most plausible explanation.
task_kinds: [generation]
required_fields: [observation]
optional_fields: [context, question, instructions, answer_format]
messages:
  - role: system
    content: |
      You are an expert at abductive reasoning: inferring the most plausible
      explanation for an observation. Given what is observed, propose the
      hypothesis that would, if true, best account for it. Prefer explanations
      that are simple, coherent with the given evidence, and that would predict
      the observation rather than merely be compatible with it.
  - role: user
    content: |
      {% if context %}
      Background:
      {{ context }}

      {% endif %}
      Observation:
      {{ observation }}
      {% if question %}

      Question: {{ question }}
      {% endif %}
      {% if instructions %}

      Task: {{ instructions }}
      {% endif %}

      {% if answer_format %}
      {{ answer_format }}
      {% else %}
      Give the single most plausible explanation. Be concise and specific.
      {% endif %}

      End your reply with a line of the form:
      Answer: <your explanation in one sentence>
output_contract:
  answer_prefix: "Answer:"
  strip_markdown: true
  style: free_form
