id: sel_mcq_letter_v1
version: "1.0"
description: Zero-shot hypothesis selection -- answer with a single option label.
task_kinds: [selection]
required_fields: [observation, options]
optional_fields: [context, question, instructions, answer_format, option_labels]
messages:
  - role: system
    content: |
      You are an expert at abductive reasoning: choosing the most plausible
      explanation for an observation. Judge each candidate on how well it would
      account for everything observed, then pick exactly one.
  - role: user
    content: |
      {% if context %}
      Background:
      {{ context }}

      {% endif %}
      Observation:
      {{ observation }}
      {% if question %}

      Question: {{ question }}
      {% else %}

      Which of the following is the most plausible explanation?
      {% endif %}

      Options:
      {{ options | enumerate_options }}
      {% if instructions %}

      Task: {{ instructions }}
      {% endif %}

      Reply with the label of the single best option and nothing else, as:
      Answer: <label>
output_contract:
  answer_prefix: "Answer:"
  strip_markdown: true
  style: single_label
  labels_from_field: option_labels
