id: sel_mcq_cot_v1
version: "1.0"
description: Chain-of-thought hypothesis selection -- reason over options, then pick one.
task_kinds: [selection]
required_fields: [observation, options]
optional_fields: [context, question, instructions, answer_format, option_labels]
messages:
  - role: system
    content: |
      You are an expert at abductive reasoning -- inference to the best
      explanation. For each candidate, ask whether the observation would be
      expected if that candidate were true, and whether it requires assumptions
      the evidence does not support. Then commit to the single best candidate.
  - role: user
    content: |
      {% if context %}
      Background:
      {{ context }}

      {% endif %}
      Observation:
      {{ observation }}
      {% if question %}

      Question: {{ question }}
      {% else %}

      Which of the following is the most plausible explanation?
      {% endif %}

      Options:
      {{ options | enumerate_options }}
      {% if instructions %}

      Task: {{ instructions }}
      {% endif %}

      Weigh the options briefly, then finish with exactly one line:
      Answer: <label of the single best option>
output_contract:
  answer_prefix: "Answer:"
  strip_markdown: true
  style: single_label
  labels_from_field: option_labels
