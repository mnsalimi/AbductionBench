id: research_strategy_v1
version: "1.0"
description: >-
  Propose the technical route to a stated open problem: which tools, structural
  dichotomies and intermediate statements would, once established, make the
  target derivable. This is the knowledge-completion form of hypothesis
  generation, and it is graded against the ingredients the real solution used.
task_kinds: [solution_strategy]
required_fields: [observation, answer_format]
optional_fields: [context, option_labels]
messages:
  - role: system
    content: |
      You are a research mathematician and scientist planning an attack on an
      open problem. Name specific machinery, not general advice: the theorems you
      would invoke, the structural dichotomies you would set up, the intermediate
      statements you would try to establish first, and where you expect the
      difficulty to concentrate. "Use induction" or "try a computer search" is
      not an answer.
  - role: user
    content: |
      {% if context %}
      Background:
      {{ context }}

      {% endif %}
      {{ observation }}

      Then close with a single line listing the ingredients your route depends on:
      Answer: <{{ answer_format }}>
output_contract:
  answer_prefix: "Answer:"
  strip_markdown: true
  style: free_form
