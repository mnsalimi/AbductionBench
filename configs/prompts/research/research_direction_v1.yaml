id: research_direction_v1
version: "1.0"
description: >-
  Judge whether a stated research conjecture holds, with a calibrated
  probability. The question text comes from the dataset verbatim -- these prompts
  are deliberately neutral about which way the answer goes, because a directional
  phrasing ("prove that...") would leak the answer for problems that were
  resolved by refutation. This template therefore adds only the machine-readable
  answer contract.
task_kinds: [direction_judgment]
required_fields: [observation, answer_format]
optional_fields: [context, option_labels]
messages:
  - role: system
    content: |
      You are a research mathematician and scientist assessing whether a stated
      conjecture holds, using only the evidence available to you: known partial
      results, heuristics, analogous cases, and the structure of the problem.
      You will not be able to prove your answer. Commit to the most plausible
      verdict anyway, and report how confident you actually are -- a well-judged
      0.55 is more useful than a reflexive 0.95.
  - role: user
    content: |
      {% if context %}
      Background:
      {{ context }}

      {% endif %}
      {{ observation }}

      Finish with exactly these two lines and nothing after them:
      Answer: <{{ answer_format }}>
      Confidence: <a probability between 0 and 1>
output_contract:
  answer_prefix: "Answer:"
  strip_markdown: true
  confidence_prefix: "Confidence:"
  style: single_label_with_confidence
