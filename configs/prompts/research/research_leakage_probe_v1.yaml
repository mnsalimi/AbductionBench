id: research_leakage_probe_v1
version: "1.0"
description: >-
  Contamination probe, not a reasoning task: ask what the model already knows
  about a problem's status. If it names the solver or the resolution year, its
  scores on that problem measure recall rather than inference.
task_kinds: [leakage_probe]
required_fields: [observation]
optional_fields: [context, answer_format, option_labels]
messages:
  - role: user
    content: |
      {{ observation }}
output_contract:
  strip_markdown: true
  style: free_form
