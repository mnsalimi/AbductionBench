id: reasoning_differential_elimination_v1
version: "1.0"
description: Counts distinct unordered option combinations compared in selection reasoning.
task_kinds: [judge]
required_fields: [question, reasoning_chain, options, option_count]
optional_fields: []
messages:
  - role: system
    content: |
      You measure differential elimination in a selection-stage reasoning chain.
      Analyze silently. Count the number of distinct unordered combinations of the
      given answer options that the model explicitly compares against each other.
      A comparison may be pairwise or involve more than two options at once. Count a
      repeated comparison of the same combination only once. Do not count discussion
      of an option in isolation. Return only the requested JSON.
  - role: user
    content: |
      QUESTION AS PRESENTED TO THE MODEL:
      {{ question }}

      AVAILABLE OPTIONS ({{ option_count }} total):
      {{ options }}

      MODEL CHAIN OF REASONING:
      {{ reasoning_chain }}

      Return exactly:
      {"differential_elimination": <integer>}
output_contract:
  json_fields:
    differential_elimination: nonnegative_integer
