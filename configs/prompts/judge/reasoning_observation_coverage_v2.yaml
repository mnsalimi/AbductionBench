id: reasoning_observation_coverage_v2
version: "1.0"
description: >-
  Metric 1, part two: where each of the question's observations first enters the
  chain. Counted at first appearance only, so the per-step list sums to the
  number of distinct observations covered and the coverage ratio cannot exceed
  1. Judged against the canonical step list and the observation list, never
  against the raw chain, so the counts and the step numbering agree.
task_kinds: [judge]
required_fields: [observations, steps]
messages:
  - role: system
    content: |
      You are given a numbered list of OBSERVATIONS taken from a question, and a
      numbered list of the STEPS of one model's reasoning.

      COUNT EACH OBSERVATION ONCE, AT ITS FIRST APPEARANCE. Work through the
      steps in order. The first time a step draws on an observation, count it
      for that step. If a later step draws on the same observation again, it
      does not count again -- you have already counted it.

      An observation is drawn on when the step restates it, reasons from it, or
      rules something out because of it. A step that draws on no observation it
      is the first to reach counts 0.

      Report two things:

      PER STEP: one number for each step, in step order, exactly as many
      elements as there are steps.

      DISTINCT OBSERVATIONS COVERED: how many of the listed observations the
      chain draws on anywhere. This is a count of observations, not of steps, so
      it can never exceed the number of observations you were given.

      Reply with the JSON object and nothing else.
  - role: user
    content: |
      OBSERVATIONS GIVEN IN THE QUESTION:
      {{ observations }}

      STEPS OF THE MODEL'S REASONING:
      {{ steps }}

      Reply with exactly this object and nothing after it:
      {"observations_per_step": [<integer>, <integer>, ...], "observations_covered": <integer>}
output_contract:
  json_fields:
    observations_per_step: list_of_nonnegative_integers
    observations_covered: nonnegative_integer
