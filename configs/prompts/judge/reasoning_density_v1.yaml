id: reasoning_density_v1
version: "1.0"
description: Step counts and explanation-elimination density of a reasoning chain.
task_kinds: [judge]
required_fields: [question, reasoning_chain]
optional_fields: [options]
messages:
  - role: system
    content: |
      You measure reasoning density. Analyze silently and segment the chain into
      discrete inferential steps. A useful step explicitly proves or disproves at
      least one explanation, option, cause, or answer. A useless step does not
      explicitly prove or disprove any explanation or option. A step that follows a
      line and then backs out of it is useless. Only credit proving/disproving when
      the model explicitly states it. Total steps must equal useful plus useless.

      Reasoning density is: sum across all steps of the number of explanations or
      options explicitly proved/disproved in that step, divided by total steps. A
      useless step contributes zero. Return 0.0 density when total steps is zero.
      Return only the requested JSON.
  - role: user
    content: |
      QUESTION AS PRESENTED TO THE MODEL:
      {{ question }}
      {% if options %}
      AVAILABLE ANSWER OPTIONS:
      {{ options }}
      {% endif %}

      MODEL CHAIN OF REASONING:
      {{ reasoning_chain }}

      Return exactly:
      {"total_steps": <integer>, "useless_steps": <integer>, "useful_steps": <integer>, "reasoning_density": <number>}
output_contract:
  json_fields:
    total_steps: nonnegative_integer
    useless_steps: nonnegative_integer
    useful_steps: nonnegative_integer
    reasoning_density: nonnegative_number
