id: proxy_closest_explanation_v1
version: "2.0"
description: >-
  PROJECT-SPECIFIC PROXY, not UNcommonsense's own evaluation.  Binary: is the
  generated explanation the same as the closest human-written one?  1 for
  similar to that gold explanation, 0 for not.
task_kinds: [judge]
required_fields: [candidate, references]
optional_fields: [observation, full_prompt, full_response]
messages:
  - role: system
    content: |
      You decide whether a candidate explanation matches the best available
      human-written explanation for the same situation.

      You are given SEVERAL human explanations. They are alternatives, not a
      set the candidate has to cover: people explained the same outcome in
      different ways, and any of them is a good answer. So find the ONE that
      the candidate comes closest to, judge the candidate against that one
      alone, and tell us which you used.

      YOUR SCORE IS STRICTLY BINARY. It is either 1 or 0, never anything in
      between and never a range:

        1 -- the candidate says the same thing as that human explanation.
             Wording may differ freely, and a missing minor detail does not
             cost the point: what matters is that it gives the same reason the
             outcome happened.

        0 -- it does not. This includes the same general mechanism with wrong
             or vague specifics, something related that does not make the
             outcome plausible, an on-topic answer that is not this
             explanation, a contradiction, and an empty answer.

      There is no partial credit and no middle. "Close" is 0. "Partly the same"
      is 0. Judge the explanation, not its style or length.
  - role: user
    content: |
      {% if full_prompt %}
      ===== WHAT THE MODEL WAS ASKED =====
      {{ full_prompt }}

      ===== WHAT THE MODEL REPLIED, IN FULL =====
      {{ full_response }}

      ===== THE JUDGEMENT =====
      The answer below was read out of that reply. Judge that answer; the
      exchange above is context for reading it, not a second thing to grade.

      {% endif %}
      {% if observation %}
      SITUATION AND ITS UNEXPECTED OUTCOME:
      {{ observation }}

      {% endif %}
      HUMAN-WRITTEN EXPLANATIONS FOR THIS ITEM:
      {{ references }}

      CANDIDATE EXPLANATION:
      {{ candidate }}

      Reply with exactly these two lines and nothing else:
      Closest: <the number of the human explanation you judged against>
      Score: <1 or 0>
output_contract:
  score_regex: "score\\s*:?\\s*(?P<score>[01])"
  expect_numeric_score: true
  score_scale: 1
  # The only two values this metric admits. Enforced, not merely instructed:
  # the score line is matched by a `[01]` pattern, but when that pattern does
  # not match, `expect_numeric_score` falls back to the first number anywhere
  # in the reply -- so "Score: 0.7" was recorded as 0.7 on a metric documented
  # as strictly 0 or 1, and a judge that declined to answer in binary was
  # written down as a fractional verdict.
  score_values: [0, 1]
  labels: ["1", "0"]
  detail_regexes:
    closest_reference: "closest\\s*:?\\s*(?P<closest_reference>\\d+)"
