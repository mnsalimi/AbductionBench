id: reasoning_branchiness_selection_v3
version: "1.0"
description: >-
  Metric 3, selection form: hypotheses newly raised per step. A separate prompt
  from the generation form so the judge is never left to infer which kind of
  task it is looking at. The option count is NOT read here -- it arrives from
  the wave-one option-count prompt, so branchiness and the n it normalizes by
  are not two readings of the same question.
task_kinds: [judge]
required_fields: [steps, question, option_count, step_count, model_answer]
messages:
  - role: system
    content: |
      You are given a QUESTION that offers a fixed set of answer choices, and a
      numbered list of the STEPS of one model's reasoning over them.

      BRANCHINESS: for each step, how many hypotheses the model newly proposes or
      brings into consideration in that step. Newly: a hypothesis already raised
      in an earlier step does not count again, however often it is revisited. A
      step that raises none counts 0. One number per step, in step order, exactly
      as many elements as there are steps.

      You are told how many options the question offers. That count is fixed
      and is not yours to revise; it is given so you can tell an option the
      question already listed from a hypothesis the model brought in itself.

      MENTIONS: for each step, how many times the model refers to a candidate
      answer in that step AT ALL -- the same hypothesis counted again every
      time it comes up, including the step that first raises it. Where the
      count above asks which candidates were NEW, this one asks how many
      references there were, new or not. A step that names no candidate is 0.

      Report both as counts. Do not compare them, combine them, or adjust one
      because of the other.

      THE MODEL'S OWN ANSWER IS SHOWN TO YOU, AND IT IS NOT THE RIGHT ANSWER.
      It is what this model concluded at the end of the reasoning above --
      nothing more. It may be correct or incorrect; you are not told which and
      it is not your job here to decide. It is given so you can read the chain
      as the argument that led to it, which is often the only way to tell what
      an earlier step was for.

      Do not treat it as a correct answer, do not grade the chain against it,
      and do not let it change a count you would otherwise have made.

      OUTPUT FORMAT -- READ THIS BEFORE REPLYING.
        * Reply with ONE JSON object and nothing else. No preamble, no
          markdown fence, no text after the closing brace.
        * THERE ARE EXACTLY {{ step_count }} STEPS. EVERY list you return must
          have EXACTLY {{ step_count }} elements -- one per step, in step
          order, including the steps whose value is 0. Count your elements
          before you reply.
        * Every element is a non-negative integer.
  - role: user
    content: |
      QUESTION AS PRESENTED TO THE MODEL:
      {{ question }}

      NUMBER OF ANSWER OPTIONS THE QUESTION OFFERS: {{ option_count }}

      THE ANSWER THIS MODEL PRODUCED (its own conclusion, not the
      correct answer):
      {{ model_answer }}

      STEPS OF THE MODEL'S REASONING ({{ step_count }} steps):
      {{ steps }}

      Reply with exactly this object and nothing after it, with exactly
      {{ step_count }} elements in each list:
      {"branchiness_per_step": [<integer>, ...], "mentions_per_step": [<integer>, ...]}
output_contract:
  json_fields:
    branchiness_per_step: list_of_nonnegative_integers
    mentions_per_step: list_of_nonnegative_integers
