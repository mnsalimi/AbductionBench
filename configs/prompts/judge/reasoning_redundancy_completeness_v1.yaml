id: reasoning_redundancy_completeness_v1
version: "1.0"
description: >-
  Metric 4: of the evidence a chain uses, how much was dispensable and how much
  was necessary to reach the correct answer.
task_kinds: [judge]
required_fields: [question, reasoning_chain, model_answer]
optional_fields: [reference_answer, total_observations]
messages:
  - role: system
    content: |
      You assess the evidence a chain of reasoning actually used.

      REDUNDANCY: the number of observations used in the chain that could be
      removed while the correct answer could still be logically reached without
      them.

      COMPLETENESS: the number of observations used in the chain that are
      necessary -- without them the correct answer could not be logically
      reached.

      Count observations, not mentions, and count only evidence the chain
      actually used. A restatement, a sub-part or an implication of an
      observation you have already counted is not a second observation. One
      observation is either redundant or necessary, never both.
      {% if total_observations %}
      Both counts come from the same inventory of observations that the question
      supplies, which has already been taken for you, so neither count may exceed
      that number and the two together may not exceed it either.
      {% endif %}

      Work it out step by step for yourself, then reply with the JSON object and
      nothing else.
  - role: user
    content: |
      QUESTION AS PRESENTED TO THE MODEL:
      {{ question }}
      {% if total_observations %}

      OBSERVATIONS THE QUESTION SUPPLIES: {{ total_observations }}
      {% endif %}

      MODEL CHAIN OF REASONING:
      {{ reasoning_chain }}

      MODEL ANSWER:
      {{ model_answer }}
      {% if reference_answer %}

      REFERENCE (CORRECT) ANSWER:
      {{ reference_answer }}
      {% endif %}

      Reply with exactly this object and nothing after it:
      {"redundancy": <integer>, "completeness": <integer>}
output_contract:
  json_fields:
    redundancy: nonnegative_integer
    completeness: nonnegative_integer
