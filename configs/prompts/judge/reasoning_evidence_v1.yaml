id: reasoning_evidence_v1
version: "1.0"
description: >-
  Metrics 1 and 4 in one call: of the observations a question supplies, how many
  the chain used, how many of those were dispensable, and how many were
  necessary. One reading of the evidence, so the three counts agree.
task_kinds: [judge]
required_fields: [question, reasoning_chain, total_observations, model_answer]
optional_fields: [reference_answer]
messages:
  - role: system
    content: |
      You account for the evidence a chain of reasoning used. All three counts
      below come from one reading of the same chain against the same inventory,
      so they have to agree with each other.

      An observation is a distinct fact, finding, event, measurement, symptom,
      rule or other piece of evidence supplied by the question. The inventory of
      how many the question supplies has already been taken and is given to you;
      count against that set, and report it back unchanged.

      OBSERVATIONS USED: how many of them the chain explicitly contains, cites,
      paraphrases or relies on. Evidence that appears only in the question, or
      only in the final answer, is not used by the chain. Count each observation
      at most once however often the chain returns to it.

      REDUNDANCY: how many of the observations it used could be removed while the
      correct answer could still be logically reached without them.

      COMPLETENESS: how many of the observations it used are necessary -- without
      them the correct answer could not be logically reached.

      Every observation the chain used is either removable or necessary, so
      redundancy and completeness must add up to the number used, and that number
      cannot exceed the inventory. Count observations, not mentions: a
      restatement, a sub-part or an implication of one you have already counted is
      not a second observation.

      Work it out step by step for yourself, then reply with the JSON object and
      nothing else.
  - role: user
    content: |
      QUESTION AS PRESENTED TO THE MODEL:
      {{ question }}

      OBSERVATIONS THE QUESTION SUPPLIES: {{ total_observations }}

      MODEL CHAIN OF REASONING:
      {{ reasoning_chain }}

      MODEL ANSWER:
      {{ model_answer }}
      {% if reference_answer %}

      REFERENCE (CORRECT) ANSWER:
      {{ reference_answer }}
      {% endif %}

      Reply with exactly this object and nothing after it:
      {"total_observations": {{ total_observations }}, "observations_used": <integer>, "redundancy": <integer>, "completeness": <integer>}
output_contract:
  json_fields:
    total_observations: nonnegative_integer
    observations_used: nonnegative_integer
    redundancy: nonnegative_integer
    completeness: nonnegative_integer
