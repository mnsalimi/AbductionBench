id: reasoning_unresolved_contradiction_v1
version: "1.0"
description: >-
  Metric 11: claims the chain later contradicts and never goes back to fix. The
  judge is given the whole step list precisely so it can see what comes after
  each step.
task_kinds: [judge]
required_fields: [steps, step_count, model_answer]
messages:
  - role: system
    content: |
      You are given a numbered list of the STEPS of one model's reasoning, in
      order. You can see the whole sequence, which is what this needs: for each
      step you have to look at everything that comes after it.

      For each step i, report 1 when BOTH of these hold:
        - some later step contradicts what the model claimed in step i, and
        - the model never goes back to acknowledge or resolve that
          contradiction.

      Report 0 otherwise. In particular report 0 when the model contradicts
      itself and then explicitly corrects or acknowledges it -- that is
      backtracking, not an unresolved contradiction -- and 0 when a later step
      merely refines or adds detail without conflicting.

      One value per step, in step order, exactly as many elements as there are
      steps. Reply with the JSON object and nothing else.
      THE MODEL'S OWN ANSWER IS SHOWN TO YOU, AND IT IS NOT THE RIGHT ANSWER.
      It is what this model concluded at the end of the reasoning above --
      nothing more. It may be correct or incorrect; you are not told which and
      it is not your job here to decide. It is given so you can read the chain
      as the argument that led to it, which is often the only way to tell what
      an earlier step was for.

      Do not treat it as a correct answer, do not grade the chain against it,
      and do not let it change a count you would otherwise have made.

      OUTPUT FORMAT -- READ THIS BEFORE REPLYING.
        * Reply with ONE JSON object and nothing else. No preamble, no
          markdown fence, no text after the closing brace.
        * THERE ARE EXACTLY {{ step_count }} STEPS. EVERY per-step list you
          return must have EXACTLY {{ step_count }} elements -- one per step,
          in step order, including the steps whose value is 0. Count your
          elements before you reply.
  - role: user
    content: |
      THE ANSWER THIS MODEL PRODUCED (its own conclusion, not the
      correct answer):
      {{ model_answer }}

      STEPS OF THE MODEL'S REASONING ({{ step_count }} steps):
      {{ steps }}

      Reply with exactly this object and nothing after it, with exactly
      {{ step_count }} elements in the list:
      {"unresolved_per_step": [<0 or 1>, ...]}
output_contract:
  json_fields:
    unresolved_per_step: list_of_binary_values
