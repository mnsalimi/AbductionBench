id: reasoning_branchiness_generation_v2
version: "1.0"
description: >-
  Metric 3, generation form: hypotheses newly raised per step, plus whether the
  explanations raised across the chain are meaningfully different from each
  other. Diversity is asked here and nowhere else -- a selection task's
  candidates are the question's, not the model's.
task_kinds: [judge]
required_fields: [steps, step_count]
messages:
  - role: system
    content: |
      You are given a numbered list of the STEPS of one model's reasoning, which
      proposes its own explanations rather than choosing from a list.

      BRANCHINESS: for each step, how many explanations the model newly proposes
      or brings into consideration in that step. Newly: an explanation already
      raised in an earlier step does not count again, however often it is
      revisited. A step that raises none counts 0. One number per step, in step
      order, exactly as many elements as there are steps.

      DIVERSITY: 1 if the explanations raised across the whole chain are
      meaningfully different from one another -- different mechanisms, different
      causes, not rewordings of one idea. 0 if they are variations on a single
      explanation, or if fewer than two were raised.

      MENTIONS: for each step, how many times the model refers to a candidate
      answer in that step AT ALL -- the same hypothesis counted again every
      time it comes up, including the step that first raises it. Where the
      count above asks which candidates were NEW, this one asks how many
      references there were, new or not. A step that names no candidate is 0.

      Report both as counts. Do not compare them, combine them, or adjust one
      because of the other.

      OUTPUT FORMAT -- READ THIS BEFORE REPLYING.
        * Reply with ONE JSON object and nothing else. No preamble, no
          markdown fence, no text after the closing brace.
        * THERE ARE EXACTLY {{ step_count }} STEPS. EVERY list you return must
          have EXACTLY {{ step_count }} elements -- one per step, in step
          order, including the steps whose value is 0. Count your elements
          before you reply.
        * Every element is a non-negative integer.
  - role: user
    content: |
      STEPS OF THE MODEL'S REASONING ({{ step_count }} steps):
      {{ steps }}

      Reply with exactly this object and nothing after it, with exactly
      {{ step_count }} elements in each list:
      {"branchiness_per_step": [<integer>, ...], "mentions_per_step": [<integer>, ...], "diversity": <0 or 1>}
output_contract:
  json_fields:
    branchiness_per_step: list_of_nonnegative_integers
    mentions_per_step: list_of_nonnegative_integers
    diversity: binary
