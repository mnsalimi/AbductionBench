id: interaction_step_relevance_v1
version: "2.0"
description: >-
  INTERACTIVE DATASETS ONLY. For each action the model took during an episode,
  did it actually move the episode toward the CORRECT answer?  One binary
  verdict per step, in step order, judged with full hindsight against the gold
  answer -- not against the answer the model happened to give.  Measures how
  much of the interaction did useful work.
task_kinds: [judge]
# reference_answer is REQUIRED, not optional. It is the standard relevance is
# measured against, so a prompt rendered without it would silently ask a
# different question -- and get an answer that looked like the same metric.
required_fields: [question, steps, model_answer, reference_answer]
optional_fields: []
messages:
  - role: system
    content: |
      You are given a transcript of an investigation. A model was shown an
      opening situation, then took a numbered series of ACTIONS -- questions
      put to a patient, tests ordered, tools run, records requested -- each
      answered by the environment. At the end it gave a final answer. You are
      also shown the CORRECT ANSWER.

      For each action, decide whether it moved the investigation toward the
      CORRECT ANSWER.

      JUDGE WITH FULL HINDSIGHT, AGAINST THE CORRECT ANSWER. You know how the
      case turns out and you are meant to use that. The question is not whether
      an action looked sensible at the time, and not whether it supported the
      answer the model went on to give. It is whether, knowing the correct
      answer, that action actually helped get there.

      RELEVANT (1) means it did. Any one of these is enough:
        - what it returned is evidence for the correct answer;
        - it established something the correct answer depends on;
        - it ruled out a genuine competitor to the correct answer, narrowing
          the field toward it.

      IRRELEVANT (0) means it did not. For example:
        - it bears on nothing the correct answer turns on;
        - it led the investigation away from the correct answer;
        - it was wasted effort: it returned nothing usable, or nothing that
          bore on the correct answer;
        - it repeated an earlier action, asked for what had already been
          answered, or was superseded by a later one that did the same work.

      A STEP IS RELEVANT ONLY INSOFAR AS IT HELPED REACH THE ACTUAL CORRECT
      ANSWER, REGARDLESS OF WHAT THE MODEL ULTIMATELY ANSWERED. The model's own
      final answer is shown for context -- so you can read the transcript --
      and it is not the standard. A model that answered correctly may still
      have taken irrelevant steps to get there, and a model that answered
      wrongly may still have taken steps that were genuinely closing in on the
      correct answer before it went astray.

      Give one verdict per action, in order, exactly as many as there are
      actions. Reply with the JSON object and nothing else.
  - role: user
    content: |
      THE OPENING SITUATION THE MODEL WAS GIVEN:
      {{ question }}

      THE ACTIONS IT TOOK, IN ORDER, WITH WHAT THE ENVIRONMENT RETURNED:
      {{ steps }}

      THE CORRECT ANSWER -- judge every action's relevance against this:
      {{ reference_answer }}

      FOR CONTEXT ONLY, THE FINAL ANSWER THE MODEL GAVE (not the standard):
      {{ model_answer }}

      Reply with exactly this object and nothing after it:
      {"relevance_per_step": [<1 or 0>, <1 or 0>, ...]}
output_contract:
  json_fields:
    relevance_per_step: list_of_binary
