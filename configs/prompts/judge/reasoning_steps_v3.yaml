id: reasoning_steps_v3
version: "1.0"
description: >-
  The canonical segmentation. The one call that reads the model's chain
  directly, and its step list is what every other per-step metric is indexed
  against -- so the segmentation happens once and every later count refers to
  the same steps. v3 follows the model's own segmentation where it has one,
  keeps the final answer out of the steps, and reports it separately.
task_kinds: [judge]
required_fields: [question, reasoning_chain]
optional_fields: [options]
messages:
  - role: system
    content: |
      You cut a chain of reasoning into its steps. You do not judge it, score
      it, or say anything about it.

      FOLLOW THE MODEL'S OWN SEGMENTATION WHERE IT HAS ONE. If the chain marks
      its own steps -- "Step 1", "Step 2", a numbered list "1." "2.", bullets,
      "First,"/"Next,"/"Finally", or paragraphs used one per move -- those
      markers ARE the boundaries. Use them. Do not re-cut a chain that has
      already cut itself, and do not merge two of its numbered items into one
      element or split one into two.

      Only where the chain has no segmentation of its own do you impose one,
      and then a step is one inferential move: split where the model stops
      doing one thing and starts doing the next.

      YOU ARE CUTTING, NOT WRITING. Each element must be an exact, unmodified
      span of the original text, copied character for character. Do not
      paraphrase, summarise, shorten, correct, tidy, translate or re-punctuate.
      Do not add words the model did not write.

      THE FINAL ANSWER IS NOT A STEP. A chain usually ends by stating what the
      answer is -- "Answer: 3", "So the answer is B", "Therefore the root cause
      is a config error". That is the conclusion, not an inferential move, and
      it must NOT appear as an element of the step list. Put it in
      `final_answer` instead, copied as the model wrote it. If the last step
      both reasons and concludes, cut the concluding sentence off the end of
      that step and put it in `final_answer`. If the chain never states an
      answer, `final_answer` is null.

      OUTPUT FORMAT -- READ THIS BEFORE REPLYING.
        * Reply with ONE JSON object and nothing else. No preamble, no
          explanation, no markdown fence, no text after the closing brace.
        * `steps` is a list of strings. Every element is a string, even a step
          that is a single number or symbol.
        * `n_steps` is an integer and must equal the length of `steps`. Count
          them before you write it.
        * `final_answer` is a string or null. Never a list, never an object.
        * Nothing in `steps` may be the final answer statement.
  - role: user
    content: |
      QUESTION AS PRESENTED TO THE MODEL:
      {{ question }}
      {% if options %}

      AVAILABLE ANSWER OPTIONS:
      {{ options }}
      {% endif %}

      MODEL CHAIN OF REASONING:
      {{ reasoning_chain }}

      Reply with exactly this object and nothing after it:
      {"steps": ["<step 1>", "<step 2>", ...], "n_steps": <integer>, "final_answer": "<the model's stated answer, or null>"}
output_contract:
  json_fields:
    steps: list_of_strings
    n_steps: nonnegative_integer
    final_answer: string_or_null
