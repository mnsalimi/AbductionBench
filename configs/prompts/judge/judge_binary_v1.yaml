id: judge_binary_v1
version: "2.0"
description: >-
  Binary equivalence judge: does a generated explanation express the same
  hypothesis as the reference?  Returns 1 or 0 and nothing between them.
  Used only when engine.judge.enabled is true.
task_kinds: [judge]
required_fields: [candidate, gold]
optional_fields: [observation, context, criteria, full_prompt, full_response]
messages:
  - role: system
    content: |
      You grade candidate explanations against a reference explanation. Judge
      semantic equivalence of the hypothesis, not wording: paraphrases,
      synonyms and differing levels of detail still count as equivalent if they
      identify the same underlying cause. A candidate that names a different
      cause, hedges without committing, or adds a contradictory mechanism is not
      equivalent.

      YOUR SCORE IS STRICTLY BINARY. It is either 1 or 0, never anything in
      between and never a range:

        1 -- the candidate identifies the same explanation as the reference.
        0 -- it does not.

      There is no partial credit. A candidate that is close but names a
      different cause scores 0, not a fraction. If the two are equivalent under
      the rule above, score 1; in every other case, including an empty or
      unreadable answer, score 0.
  - role: user
    content: |
      {% if full_prompt %}
      ===== WHAT THE MODEL WAS ASKED =====
      {{ full_prompt }}

      ===== WHAT THE MODEL REPLIED, IN FULL =====
      {{ full_response }}

      ===== THE JUDGEMENT =====
      The answer below was read out of that reply. Judge that answer; the
      exchange above is context for reading it, not a second thing to grade.

      {% endif %}
      {% if observation %}
      Observation:
      {{ observation }}

      {% endif %}
      Reference explanation:
      {{ gold }}

      Candidate explanation:
      {{ candidate }}
      {% if criteria %}

      Additional criteria: {{ criteria }}
      {% endif %}

      Does the candidate identify the same explanation as the reference?
      Reply with exactly one line, and nothing else:
      Score: 1
      or
      Score: 0
output_contract:
  score_regex: "score\\s*:?\\s*(?P<score>[01])"
  expect_numeric_score: true
  # 1 already means 1.0; declared so nothing divides the score by a scale it
  # no longer has.
  score_scale: 1
  # The only two values this metric admits. Enforced, not merely instructed:
  # the score line is matched by a `[01]` pattern, but when that pattern does
  # not match, `expect_numeric_score` falls back to the first number anywhere
  # in the reply -- so "Score: 0.7" was recorded as 0.7 on a metric documented
  # as strictly 0 or 1, and a judge that declined to answer in binary was
  # written down as a fractional verdict.
  score_values: [0, 1]
  # The prompt demands 1 or 0. These are here so a judge that answers "yes"
  # anyway is still understood as 1 rather than silently scoring 0 -- the
  # verdict stays strictly binary either way, this only widens what can be
  # read as one.
  labels: ["1", "0", "yes", "no"]
