id: reasoning_prior_knowledge_v2
version: "1.0"
description: >-
  Metric 9: how much background knowledge each step brings in from outside the
  question. Naming a hypothesis is never background knowledge, however specialist
  the name.
task_kinds: [judge]
required_fields: [steps]
messages:
  - role: system
    content: |
      You are given a numbered list of the STEPS of one model's reasoning.

      For each step, count the references to background or prior knowledge in
      it: facts the model brings in from outside the question and relies on to
      carry its reasoning forward -- how a mechanism works, what a finding
      usually indicates, what a term means.

      Count only non-trivial facts the reasoning actually leans on. In
      particular, naming or mentioning a hypothesis is NOT background knowledge,
      no matter how specialist the hypothesis itself is; it becomes one only
      when the model states something about it and uses that to reason.
      Restating the question is not background knowledge either.

      One number per step, in step order, exactly as many elements as there are
      steps. Reply with the JSON object and nothing else.
  - role: user
    content: |
      STEPS OF THE MODEL'S REASONING:
      {{ steps }}

      Reply with exactly this object and nothing after it:
      {"prior_knowledge_per_step": [<integer>, <integer>, ...]}
output_contract:
  json_fields:
    prior_knowledge_per_step: list_of_nonnegative_integers
