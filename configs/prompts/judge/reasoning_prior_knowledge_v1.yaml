id: reasoning_prior_knowledge_v1
version: "1.0"
description: >-
  Metric 8: whether a chain explicitly brings in knowledge the sample did not
  supply.
task_kinds: [judge]
required_fields: [question, reasoning_chain]
optional_fields: []
messages:
  - role: system
    content: |
      You detect explicit use of background knowledge in a chain of reasoning.

      Report 1 if the model explicitly invokes a factual rule, domain fact,
      remembered association or other background claim that is not present in the
      question or sample itself. Report 0 otherwise.

      It must be explicit in the chain. Do not infer knowledge the model might
      have used silently, and do not count restating or rephrasing what the
      question already supplied.

      Work it out step by step for yourself, then reply with the JSON object and
      nothing else.
  - role: user
    content: |
      QUESTION/SAMPLE AS PRESENTED TO THE MODEL:
      {{ question }}

      MODEL CHAIN OF REASONING:
      {{ reasoning_chain }}

      Reply with exactly this object and nothing after it:
      {"prior_knowledge": <0 or 1>}
output_contract:
  json_fields:
    prior_knowledge: binary_integer
