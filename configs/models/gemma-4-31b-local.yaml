# google/gemma-4-31B-it served by vLLM on this instance (gemma-4-31b-vllm,
# 127.0.0.1:18006), reached directly because the engine runs on the GPU host.
#
# The largest model this card holds, and it is run alone: at
# GPU_MEMORY_UTILIZATION=0.93 it occupies ~91.5 of 97,887 MiB, so nothing else
# is served beside it. That is why a run including this model cannot judge
# inline -- the answers are generated first and the verdicts bought on a later
# resume, which is what the answer judge reading reused records is for.
#
# Concurrency is bounded by KV cache, not by MAX_NUM_SEQS. Measured from vLLM's
# own startup line: at 0.82 the cache held 20,382 tokens ("Maximum concurrency
# for 8,192 tokens per request: 2.49x"); at 0.93 it holds 32,788 ("4.00x").
# That 4x is the worst case -- it assumes every request fills the whole 8,192
# window, and vLLM allocates per actual token, so a typical prompt runs several
# times more concurrently. group_size 8 x max_parallel_batches 2 = 16 in flight
# matches MAX_NUM_SEQS=16; sending more would only queue inside the server.
extends: [gemma-4-e4b.yaml]
model:
  id: gemma-4-31b-local
  model_name: google/gemma-4-31B-it
  description: >-
    Gemma 4 31B instruction-tuned, served by vLLM with MAX_MODEL_LEN=8192 and
    MAX_NUM_SEQS=8.
  endpoint:
    base_url: ${env:ABENCH_31B_URL|http://127.0.0.1:18006}
    api_key: ${env:ABENCH_ADMIN_KEY|${env:ABENCH_API_KEY}}
    batch:
      base_url: ${env:ABENCH_31B_URL|http://127.0.0.1:18006}
      path: /v1/chat/completions/batch
      group_size: 8
    discovery:
      base_url_command: null
      batch_base_url_command: null
  limits:
    max_parallel_batches: 2
    requests_per_minute: null
    tokens_per_minute: null
    # MAX_MODEL_LEN from gemma-4-31b/.env -- half the e4b's window, so the
    # engine's per-sample output clamp bites harder here. It is reported.
    context_window: 8192
  notes:
    served_by: vLLM (gemma-4-31b-vllm supervisor service, port 18006)
