# TypeSafe's jev, called through OpenRouter's System One decision API.
#
# NOT A CHAT MODEL, and every unusual thing in this file follows from that.
# https://typesafe.ai/blog/introducing-system-one-models-and-jev
#
# The endpoint takes the evidence as `state` and the answer options as named
# `criteria`, and returns which key it chose plus a probability over all of
# them:
#
#   {"answers": {"answer": {"type": "choice", "choice": "6",
#                           "probabilities": {"1": 0.01, ..., "11": 0.01},
#                           "confidence": 0.25}}}
#
# Consequences worth stating rather than discovering:
#
#   * SELECTION ONLY. There is no free text to produce, so a generation task
#     has nothing for it to do. The run config restricts it to SCS.
#   * It never sees a rendered prompt. The system instruction, the answer
#     contract and the cot instruction that shape every other model's answer do
#     not reach it -- it is given the observation, the question, the task
#     instruction and the options as data. So "jev under cot" is not a thing
#     that exists, and a cot column for it would be a different measurement
#     wearing the same name.
#   * No batch route and no group size: one question, one request.
#
# The choice is turned into the dataset's own answer line (`Answer: <label>`)
# so jev is scored by exactly the same code as every other model, which is what
# makes the column comparable. The probabilities and confidence -- the one
# thing this endpoint gives that a chat model does not -- are kept on the raw
# record rather than discarded.
model:
  id: jev-openrouter
  model_name: ${env:ABENCH_JEV_MODEL|typesafe/jev-1.13}
  description: >-
    TypeSafe jev via OpenRouter's System One decision API; selection (SCS)
    tasks only, answering from the options as structured criteria rather than
    from a rendered prompt.
  reasoning_model: false

  # WHAT THIS MODEL CAN BE ASKED, declared on the model rather than left to
  # whoever writes the run config. A decision endpoint has nothing to do on a
  # generation task -- there are no options to send -- and the cot instruction
  # that defines a cot cell lives in a rendered prompt it never receives, so a
  # "jev cot" column would be the io measurement under another name.
  #
  # Carrying it here means jev can sit in a run alongside models that answer
  # the whole grid: it is simply not asked the cells it cannot answer. That is
  # what lets one run cover both, instead of two runs and two sync threads
  # writing the same Drive folder -- which is how 95 duplicated remote paths
  # were created.
  only_tasks:
    # SCS ONLY -- never MCS. A choice question returns one option; an MCS task
    # is graded as a SET, so answering it with a single choice scores a
    # one-element set against a multi-label gold and reports the result as
    # though the model had tried. That is what happened to aer before this
    # filter existed: set_f1 0.6467 off precision 0.86 and recall 0.55, which
    # is the arithmetic signature of one answer where several were wanted.
    # aer offers only MCS, so under this filter it gets no jev task at all.
    selection_modes: [SCS]
    task_kinds: [selection]
    # io, but the ROW WILL NOT SAY io -- `ModelConfig.has_prompt_mode` is false
    # for a decision endpoint, so the task identity records "n/a". This entry
    # only decides which underlying variant is run, and something has to be
    # picked: jev never sees the rendered prompt, so the io and cot variants of
    # one question produce a byte-identical request and running both would ask
    # the same thing twice under two names.
    prompt_modes: [io]

  endpoint:
    protocol: systemone
    base_url: ${env:ABENCH_OPENROUTER_BASE_URL|https://openrouter.ai/api}
    api_key: ${env:OPENROUTER_API_KEY}
    systemone_path: /v1/systemone
    models_path: /v1/models
    batch:
      enabled: false
    discovery:
      base_url_command: null
      batch_base_url_command: null

  sampling:
    # NOT SENT AND NOT RECORDED. TypeSafe's API reference documents exactly
    # three top-level fields -- model, state, questions -- and no sampling
    # parameters at all. There is no temperature here to set: the model scores
    # each option against its rubric in parallel rather than sampling tokens,
    # so a temperature would have nothing to apply to.
    #
    # The values below exist because the engine's budget check reads
    # `max_tokens_cap` and `context_window` before a request is planned. They
    # never reach the wire, and `_run_batch` no longer writes a `sampling` block
    # onto a decision endpoint's raw record either -- it described a request
    # that was never made.
    max_tokens_default: 512
    max_tokens_cap: 512
    max_tokens_floor: 16
    extra: {}

  limits:
    # One request per sample, so this is simply how many are in flight.
    max_parallel_batches: ${env:ABENCH_JEV_PARALLEL|16}
    requests_per_minute: null
    tokens_per_minute: null
    max_connections: 64
    # Generous: the request carries the observation and every option, and the
    # engine only uses this to reject prompts that cannot possibly fit.
    context_window: 131072

  notes:
    served_by: OpenRouter (/v1/systemone, provider TypeSafe)
    protocol_note: >-
      Decision API, not chat completions. Restricted to selection tasks; see
      configs/runs/jev_scs.yaml.
