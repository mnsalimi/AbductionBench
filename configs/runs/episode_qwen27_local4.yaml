# The interactive + sequential datasets at 50 records each (the same 50 as
# episode_trio50.yaml), for five more models in ONE run, all at once:
#   qwen3.5-27b      OpenRouter, cheapest host (Alibaba, no fallbacks)
#   gemma-4-E4B / E2B, qwen3.5-4B / 2B   served locally by vLLM, all four on
#                    the GPU together (tools/run_episode_qwen27_local4.sh
#                    starts them: 65,536 context, 512 sequences each)
# Same protocol as episode_trio50: io only, temperature 0.7, native reasoning
# off, whole history every turn, each record asked once. Judges: gpt-oss-120b
# on OpenRouter (AkashML) -- the GPU is the four models'. Simulators:
# gpt-4o-mini. Local only: no Drive.
extends:
  - full.yaml

name: episode-qwen27-local4
description: >-
  qwen3.5-27b (OpenRouter, cheapest) and the four small local models on 50
  records of every interactive and sequential dataset.

dataset_force:
  sample_size: 50

modes:
  repeats_by_delivery: {interactive: 1, sequential: 1}

engine:
  output_root: /workspace/AbductionBench/runs
  concurrency:
    max_parallel_tasks: 35
    max_parallel_batches_global: 1024
  # OPENROUTER CONCURRENCY KEPT MODERATE (the model, the judges, the
  # simulators): enough to keep things moving, not so much that providers
  # answer with 429s or time out. episode_trio50 ran 24 judge calls and drew
  # ~90 rate limits (all retried); this is lower.
  judge:
    enabled: true
    defer: false
    model: gpt-oss-120b-akashml
    group_size: 1
    max_parallel_calls: 16
    context_window: 65536
  reasoning_judge:
    enabled: true
    model: gpt-oss-120b-akashml
    group_size: 1
    max_parallel_calls: 16
    kill_switch: "off"
    context_window: 65536
  # 8 held every simulated turn of the last run in one queue (vivabench
  # finished last because of it); 16 doubles that without pushing gpt-4o-mini
  # hard. Throughput only; answers are unchanged.
  simulator:
    max_parallel_calls: 16
  retry:
    max_attempts: 8
    max_backoff_s: 300
    rate_limit_backoff_s: 30
  timeouts:
    read_s: 1800
  sync:
    enabled: false
  reporting:
    interim_after_each_dataset: false

models:
  - file: ../models/qwen3-5-27b-openrouter.yaml
    sampling:
      extra:
        provider: {sort: price, allow_fallbacks: false}
    limits:
      max_parallel_batches: 24
      max_connections: 48
  # Local: one request per call (group_size 1) and up to 256 in flight each,
  # under the servers' 512 sequences; the servers run at 65,536 context.
  - file: ../models/gemma-4-e4b-local.yaml
    endpoint: {batch: {group_size: 1}}
    limits: {max_parallel_batches: 256, max_connections: 300, context_window: 65536}
  - file: ../models/gemma-4-e2b-local.yaml
    endpoint: {batch: {group_size: 1}}
    limits: {max_parallel_batches: 256, max_connections: 300, context_window: 65536}
  - file: ../models/qwen3-5-4b-local.yaml
    endpoint: {batch: {group_size: 1}}
    limits: {max_parallel_batches: 256, max_connections: 300, context_window: 65536}
  - file: ../models/qwen3-5-2b-local.yaml
    endpoint: {batch: {group_size: 1}}
    limits: {max_parallel_batches: 256, max_connections: 300, context_window: 65536}
  - file: ../models/gpt-oss-120b-openrouter.yaml
    id: gpt-oss-120b-akashml
    sampling:
      extra:
        provider: {order: ["akashml/bf16"], allow_fallbacks: false, require_parameters: true}
        reasoning: {effort: low}
    limits:
      max_parallel_batches: 16
      max_connections: 32
