# Qwen3.5-27B, the IO pass, native reasoning OFF (enable_thinking: false) --
# treated exactly as Qwen3.5-2B/4B were in trio_local4_generate_io.yaml: same
# datasets, prompts, sampling, 65,536-token window and 32,000-token answer
# budget, into the same run folder. GENERATING ONLY: judges deferred, no
# engine sync (tools/sync_run.sh backs the folder up). Served alone on the
# card (qwen3.5-27b-vllm, :18007) by tools/qwen_cot_then_27b.sh.
extends:
  - openrouter_trio.yaml

name: openrouter-trio

modes:
  prompt_modes: [io]

engine:
  concurrency:
    max_parallel_tasks: 72
    max_parallel_batches_global: 64
  timeouts:
    read_s: 7200

  judge:
    enabled: false
    defer: true

  reasoning_judge:
    enabled: false

  sync:
    enabled: false

models:
  # 8 x 16 = 128 in flight: the server's MAX_NUM_SEQS. io answers are short,
  # so all of them fit in the KV cache at once.
  - file: ../models/qwen3-5-27b-local.yaml
    endpoint:
      api_key: ${env:ABENCH_API_KEY}
      batch:
        group_size: 16
    sampling:
      extra:
        chat_template_kwargs: {enable_thinking: false}
    limits:
      max_parallel_batches: 8
      max_connections: 160
      context_window: 65536
