# Structural metrics over chains of reasoning, on top of the full suite.
#
# Two ways to use it:
#
#   abench run configs/runs/reasoning.yaml
#       a full run whose cot tasks also get the reasoning-metric columns, judged
#       inline as each task finishes.
#
#   abench judge-reasoning runs/<run-id> --config configs/runs/reasoning.yaml
#       the same metrics over a run that already happened. The answers are
#       already on disk, so this asks the model under test nothing and spends
#       judge tokens only.
#
# Either way io outputs are never judged: there is no chain in one to measure.
extends:
  - full.yaml

name: reasoning
description: >-
  The full suite with the reasoning-chain metric judge enabled: observation
  coverage, step structure and backtracking, branchiness and diversity,
  redundancy and completeness, directionality, differential elimination,
  uncertainty marking and prior knowledge, per cot sample output.

engine:
  reasoning_judge:
    enabled: true
    # gpt-oss-20b, the same judge that grades answers, and deliberately not the
    # model under test: a model scoring the structure of its own reasoning is
    # the same confound as grading its own answers.
    model: ${env:ABENCH_JUDGE_MODEL|gpt-oss-20b-local}
    # 8 x 8 = 64 judge sequences in flight, which is this server's
    # --max-num-seqs. Raise max_parallel_calls, not group_size, if the judge
    # server grows: vLLM at temperature 0 is not bit-stable across batch sizes,
    # so the batch size is what keeps verdicts comparable between runs.
    group_size: 8
    max_parallel_calls: 8
    # Think briefly, then answer. This is the single most expensive knob in the
    # stage and "low" is not a quality compromise -- measured on this suite's
    # chains at the same budget: default effort 30.2s / 1,484 completion tokens,
    # low effort 4.0s / 231, same verdict. On a long chain the default runs to
    # the budget and returns *empty content*, losing the call outright: 793 of
    # one run's 802 unparseable replies were exactly that.
    reasoning_effort: low
    # 24,000 -> 4,096 -> 16,000. Both earlier numbers were right for the judge
    # they were measured on, and 4,096 stopped being right when the judge moved
    # to gpt-oss-120b on OpenRouter with a 131,072-token window.
    #
    # Measured on that run rather than argued: of 4,690 reasoning-judge calls,
    # 239 came back unparseable, and the raw replies say exactly why -- valid
    # JSON cut off mid-token, the longest at 17,517 characters, which at this
    # suite's LaTeX-dense 4.28 chars/token is 4,093. The cap, to three digits.
    # 142 of those were `steps` and 86 `observation_inventory`: the two prompts
    # that echo content back, so their output grows with the chain they are
    # reading, and abd's chains are long formal derivations.
    #
    # `steps` is why this is worth more than 5%. Every per-step family is judged
    # against ITS segmentation, so a truncated `steps` does not lose one metric,
    # it loses the whole per-step set for that sample.
    #
    # 16,000 is ~4x what was being hit and still only 12% of the window, which
    # leaves the prompt (capped at 60,000 chars, ~22,000 tokens) room it never
    # comes close to needing. The old 65,536-window arithmetic that made 24,000
    # reckless does not apply to a window twice that size.
    #
    # THE TRADE IS REAL AND IT IS SMALL. A bigger budget gives the hidden chain
    # more room to run to the end and return empty content -- the failure the
    # 4,096 cap was chosen to stop. That failure has not gone away: 44 of the
    # 239 were empty rather than truncated. But it is 0.9% against the 4.2%
    # being fixed, `reasoning_effort: low` above is what actually bounds the
    # chain, and `_judge_many` already recovers a verdict from the reasoning
    # trace when content comes back null. Watch the ratio rather than assume
    # it: `grep -c 'unparseable reply'` against the judge-call line count.
    max_tokens: 16000
    temperature: 0.0
    cache: true
