# Structural metrics over chains of reasoning, on top of the full suite.
#
# Two ways to use it:
#
#   abench run configs/runs/reasoning.yaml
#       a full run whose cot tasks also get the reasoning-metric columns, judged
#       inline as each task finishes.
#
#   abench judge-reasoning runs/<run-id> --config configs/runs/reasoning.yaml
#       the same metrics over a run that already happened. The answers are
#       already on disk, so this asks the model under test nothing and spends
#       judge tokens only.
#
# Either way io outputs are never judged: there is no chain in one to measure.
extends:
  - full.yaml

name: reasoning
description: >-
  The full suite with the reasoning-chain metric judge enabled: observation
  coverage, step structure and backtracking, branchiness and diversity,
  redundancy and completeness, directionality, differential elimination,
  uncertainty marking and prior knowledge, per cot sample output.

engine:
  reasoning_judge:
    enabled: true
    # gpt-oss-20b, the same judge that grades answers, and deliberately not the
    # model under test: a model scoring the structure of its own reasoning is
    # the same confound as grading its own answers.
    model: ${env:ABENCH_JUDGE_MODEL|gpt-oss-20b-local}
    # 8 x 8 = 64 judge sequences in flight, which is this server's
    # --max-num-seqs. Raise max_parallel_calls, not group_size, if the judge
    # server grows: vLLM at temperature 0 is not bit-stable across batch sizes,
    # so the batch size is what keeps verdicts comparable between runs.
    group_size: 8
    max_parallel_calls: 8
    # Think briefly, then answer. This is the single most expensive knob in the
    # stage and "low" is not a quality compromise -- measured on this suite's
    # chains at the same budget: default effort 30.2s / 1,484 completion tokens,
    # low effort 4.0s / 231, same verdict. On a long chain the default runs to
    # the budget and returns *empty content*, losing the call outright: 793 of
    # one run's 802 unparseable replies were exactly that.
    reasoning_effort: low
    # 24,000 -> 4,096. The big budget was an attempt to fix those empty replies
    # by giving the chain more room; the cause was how much it wanted to think,
    # not how much room it had, so the budget only made it worse -- it left the
    # input just 41,536 tokens of a 65,536 window and two calls were rejected
    # outright for length. At low effort a verdict costs a few hundred tokens.
    max_tokens: 4096
    temperature: 0.0
    cache: true
