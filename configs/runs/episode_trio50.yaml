# The interactive + sequential datasets at 50 records each, for three models
# on OpenRouter, each on its cheapest host: gemma-4-31b-it, gpt-5.6-luna,
# gemini-3.8-flash. medqdx, med_inquire, ddxplus (SCS + MCS), vivabench,
# cloud_opsbench, athena_bench. io only, temperature 0.7, native reasoning off
# (gemini: minimal -- it cannot be switched off), whole history every turn.
# Each record asked ONCE.
#
# The first 50 records of each dataset's seeded draw: the 5 the test
# (episode_test_gemma31b.yaml) used, plus 45 new. All 50 are generated fresh,
# so every episode has the same simulator and judges.
#
# Judges: gpt-oss-120b on OpenRouter, AkashML (cheapest host; passed the
# calibration at 0.883 agreement). Environment simulators: gpt-4o-mini.
# Local only: no Drive. Start it with tools/run_episode_trio50.sh, which also
# stops it if OpenRouter spend passes the budget.
extends:
  - full.yaml

name: episode-trio50
description: >-
  gemma-4-31b-it, gpt-5.6-luna and gemini-3.8-flash (OpenRouter, cheapest
  hosts) on 50 records of every interactive and sequential dataset.

dataset_force:
  sample_size: 50

modes:
  repeats_by_delivery: {interactive: 1, sequential: 1}

engine:
  output_root: /workspace/AbductionBench-interseq/runs
  data_root: /workspace/AbductionBench/data
  concurrency:
    max_parallel_tasks: 21
    max_parallel_batches_global: 192
  judge:
    enabled: true
    defer: false
    model: gpt-oss-120b-akashml
    group_size: 1
    max_parallel_calls: 24
    context_window: 65536
  reasoning_judge:
    enabled: true
    model: gpt-oss-120b-akashml
    group_size: 1
    max_parallel_calls: 24
    kill_switch: "off"
    context_window: 65536
  retry:
    max_attempts: 8
    max_backoff_s: 300
    rate_limit_backoff_s: 30
  sync:
    enabled: false
  reporting:
    interim_after_each_dataset: false

models:
  - file: ../models/gemma-4-31b-it-openrouter.yaml
    sampling:
      extra:
        provider: {sort: price}
    limits:
      max_parallel_batches: 32
  - file: ../models/gpt-5.6-luna-openrouter.yaml
    sampling:
      extra:
        provider: {sort: price}
    limits:
      max_parallel_batches: 32
  - file: ../models/gemini-3.8-flash-openrouter.yaml
    sampling:
      extra:
        provider: {sort: price}
    limits:
      max_parallel_batches: 32
  - file: ../models/gpt-oss-120b-openrouter.yaml
    id: gpt-oss-120b-akashml
    sampling:
      extra:
        provider: {order: ["akashml/bf16"], allow_fallbacks: false, require_parameters: true}
        reasoning: {effort: low}
    limits:
      max_parallel_batches: 48
      max_connections: 96
