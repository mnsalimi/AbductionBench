# The io half of openrouter-trio, with reasoning OFF where the model allows it.
#
# openrouter_trio.yaml left both rented reasoning models on their provider
# default, so their io answers were produced after a hidden chain -- which is
# not io. Stopped 2026-09-24 02:00 once seen. tools/resume_openrouter_trio.sh
# sets luna's and gemini's io task folders aside and runs this file into the
# SAME run folder (`--resume`), so every io question is asked of them again.
#
# Why the set-aside is needed: the model's `sampling.extra` is sent with the
# request but is not part of the resume fingerprint, so an io record already on
# disk would be reused as it is. The same fact is what keeps the cot records
# and gemma's io records reusable under this file.
#
# Verified against the live API (2026-09-24), not assumed:
#   gpt-5.6-luna      reasoning {enabled: false} -> 0 reasoning tokens, no chain
#   gemini-3.8-flash  cannot disable ("Reasoning is mandatory for this endpoint
#                     and cannot be disabled", HTTP 400), so io runs it at
#                     effort `low` -- chosen for io only; its cot keeps the
#                     provider default it was run with (openrouter_trio.yaml)
extends:
  - openrouter_trio.yaml

name: openrouter-trio

modes:
  prompt_modes: [io]

models:
  - file: ../models/gpt-5.6-luna-openrouter.yaml
    sampling:
      extra:
        reasoning: {enabled: false}
  - file: ../models/gemini-3.8-flash-openrouter.yaml
    sampling:
      extra:
        # Low, not "off": see the header. Not `exclude`d -- hiding the chain
        # would make a reasoned answer look like io in the records.
        reasoning: {effort: low}
  # No reasoning in io to begin with: every io record it has shows none.
  - file: ../models/gemma-4-31b-it-openrouter.yaml
  - file: ../models/gpt-oss-120b-local.yaml
