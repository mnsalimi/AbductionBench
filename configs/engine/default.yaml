# ---------------------------------------------------------------------------
# Engine defaults.  Every knob the core engine has lives here; run configs
# `extends:` this file and override only what they need.
# ---------------------------------------------------------------------------
engine:
  # Run ids are stamped in this timezone: a run id names a directory here
  # and a folder on the backup remote, and both are read by people in Tehran.
  run_id_timezone: Asia/Tehran
  output_root: runs          # one directory per run
  data_root: data            # materialized datasets and caches

  concurrency:
    max_parallel_tasks: 2            # (dataset x model x template) units in flight
    max_parallel_batches_global: 6   # ceiling on concurrent batch calls, all models
    scoring_workers: 4               # threads for adapter scoring

  batching:
    # vLLM's batch endpoint shares one sampling-parameter set across the whole
    # call, so per-sample max_tokens is rounded up onto this grid to keep
    # batches packable.  Rounding up only grants headroom, never truncates.
    max_tokens_quantum: 256
    sort_by_input_tokens: true       # similar-length conversations in one call
    bisect_on_invalid_request: true  # isolate a poison sample instead of losing the batch
    # Also halve a batch whose retries were exhausted by timeouts/5xx: a big
    # batch can exceed a proxy's request ceiling (Cloudflare quick tunnels cut
    # off at ~100s with HTTP 524) or queue behind a busy server.
    bisect_on_timeout: true
    fallback_to_single: true         # if a model has no working batch route
    max_group_size: 64

  retry:
    max_attempts: 5
    initial_backoff_s: 2.0
    max_backoff_s: 120.0
    backoff_multiplier: 2.0
    jitter: 0.3
    rate_limit_backoff_s: 20.0
    retry_error_classes: [transient, rate_limit, unknown, protocol]
    # There is no budget-exhaustion retry. Every request already asks for the
    # whole remaining context window, so a response that stops at the budget
    # cannot be re-issued with a bigger one; it is reported as truncated.
    recovery:
      enabled: true
      probe_path: /v1/models
      probe_timeout_s: 30
      # Quick-tunnel URLs rotate on restart: re-run the model's discovery
      # command on a connection error and pick up the new address.
      rediscover_on_connection_error: true
      probe_interval_s: 15
      max_probe_attempts: 20

  timeouts:
    connect_s: 30
    read_s: 1800     # a batch of long generations can take many minutes
    write_s: 120
    pool_s: 60

  checkpoint:
    enabled: true
    resume_policy: strict   # strict | sample_id | off
    fsync_every: 1
    store_raw_payloads: true
    # Keep this many request/response payloads per task, so the sample prompts
    # and the model's answers are visible for every dataset without writing the
    # ~1,100 files an uncapped run produces. Each file is one whole batch (16
    # conversations), so 3 is ~48 prompt/response pairs per task. 0 = keep them
    # all, in which case exclude raw/ from sync below or the upload will exhaust
    # a Drive-style request quota.
    max_raw_payloads: 3

  tokenizer:
    backend: auto           # auto | hf | tiktoken | heuristic | endpoint
    hf_model: null          # set to a HF repo id for exact counting
    tiktoken_encoding: cl100k_base
    chars_per_token: 3.6
    per_message_overhead: 4
    safety_margin_tokens: 64

  limits:
    input_token_budget: 16000   # INPUT tokens only; output budget is separate
    # An interactive episode's context is a transcript that grows every turn,
    # not a single prompt, so it gets a larger ceiling. Static delivery keeps
    # the 16,000 the specification sets. Note this is a ceiling, not a promise:
    # an episode can still only use what the model's context window holds, and
    # one that runs out of window ends there and is reported as
    # context_exhausted rather than failing.
    input_token_budget_by_delivery:
      interactive: 32000
      sequential: 32000
    # An oversize interactive item is dropped, not replaced: a replacement
    # episode is a different episode.
    on_oversize_by_delivery:
      interactive: skip
      sequential: skip
    on_oversize: resample       # resample | skip | fail
    max_resample_attempts: 200
    oversize_abort_fraction: 0.5

  logging:
    level: INFO
    json_log: true
    progress: auto
    log_text_clip: 400

  judge:
    enabled: false            # opt-in LLM-as-judge scoring stage
    model: null               # must be one of the run's models
    template: judge_binary_v1
    max_tokens: 512
    temperature: 0.0
    # In-flight sequences are group_size x max_parallel_calls; 8 x 8 = 64 is
    # this judge server's --max-num-seqs. It costs no GPU memory: vLLM's KV
    # cache is preallocated at startup, so this fills slots already paid for.
    group_size: 8
    max_parallel_calls: 8
    cache: true

  # Structural metrics over chains of reasoning -- observation coverage, step
  # structure and backtracking, branchiness and diversity, redundancy and
  # completeness, directionality, differential elimination, uncertainty marking
  # and prior knowledge.
  #
  # Independent of the answer judge above: this one measures how the model got
  # there, not whether it arrived. It runs for cot and self-consistency outputs
  # only -- an io output has no chain in it to measure -- and the observation
  # inventory is cached by the exact question, so its total is bought once and
  # shared across every model, repeat and task that asks that question.
  reasoning_judge:
    enabled: false
    model: null               # must be one of the run's models
    # A ceiling, not an allocation. It has to cover the judge's own hidden
    # reasoning as well as the JSON verdict: a judge whose chain spends the
    # whole budget returns empty content, and every metric in that call is lost.
    max_tokens: 8192
    temperature: 0.0
    # In-flight judge sequences are group_size x max_parallel_calls. Size them
    # together to the judge server's --max-num-seqs (64 here): more only queues
    # inside vLLM, less leaves scheduler slots idle.
    #
    # Raise max_parallel_calls for speed, not group_size: vLLM at temperature 0
    # is not bit-stable across batch sizes, so changing the batch size changes
    # verdicts and breaks comparability with earlier runs.
    group_size: 8
    max_parallel_calls: 8
    cache: true
    # NO `templates:` MAPPING HERE, DELIBERATELY. One prompt per metric family,
    # and the map lives in `_reasoning_judge_templates()` in core/config.py --
    # in one place, beside the code that validates it.
    #
    # It used to be duplicated here, and the copy went stale: the per-step
    # rework renamed six families and bumped most template versions, the code
    # was updated, this file was not. A YAML mapping REPLACES the default
    # wholesale rather than merging into it, so every run extending pilot.yaml
    # silently got the old eight families pointing at template ids that no
    # longer existed. The run then died at startup with "reasoning_judge.
    # templates is missing: anchoring_point, ..." -- which, in a run whose
    # judge was deferred, looked like a pass that simply finished early.
    #
    # Override it here only to point a family at a different prompt, and then
    # give the WHOLE map, because a partial one is not merged.

  # Incremental off-box backup of the run directory. Runs in a background
  # thread that shells out to rclone, so it cannot slow inference down: all the
  # network I/O happens in a separate process. Failures are logged and retried
  # on the next tick and never fail the run. Uses `rclone copy --update`, so
  # each tick sends only the files that changed and remote data is never
  # deleted.
  sync:
    enabled: false
    # Anything rclone understands: "gdrive:AbductionBench", "s3:bucket/prefix",
    # or a plain local/mounted path.
    remote_path: ""
    per_run_subdir: true      # upload into <remote_path>/<run-id>/
    interval_s: 60
    rclone_binary: rclone
    transfers: 4
    checkers: 8
    timeout_s: 300
    bandwidth_limit: ""       # e.g. "8M" to leave headroom for other traffic
    # Patterns to leave out. Empty on purpose: max_raw_payloads above bounds the
    # bulky part where it is *written*, so the sample prompts and responses ride
    # along to the backup instead of being hidden from it -- which is where
    # anyone reviewing a run goes looking for them. Add "raw/" here if you set
    # max_raw_payloads: 0.
    exclude: []
    # No pass starts within this many seconds of the last one finishing, whoever
    # asked. The interval spaces scheduled uploads; this spaces the requested
    # ones, so several datasets finishing together produce one upload, not five.
    min_gap_s: 60
    # After a rate-limited pass, wait before trying again -- doubling per
    # consecutive failure, capped here, reset by the first success. Uploads are
    # incremental, so waiting costs freshness and nothing else.
    rate_limit_backoff_max_s: 900
    extra_args: []

  reporting:
    excel_filename: abductionbench_results.xlsx
    include_sample_sheets: true
    max_sample_rows_per_sheet: 5000
    write_csv: true
    write_run_documentation: true
    # 0 = no configured limit beyond reporting.py's own EXCEL_CELL_LIMIT (32,767,
    # the real ceiling Excel can physically store in one cell). This used to be
    # 2000 -- an arbitrary, much smaller clip with no stated reason -- which
    # silently cut off full model responses (and any reasoning trace) well
    # short of what a cell can actually hold.
    response_clip_chars: 0

  # What an interrupt does (SIGINT or SIGTERM -- Ctrl-C, `kill`, `pkill -INT`).
  # First nothing new starts -- no task, batch, retry or simulator retry -- and
  # work already in flight gets drain_timeout_s to finish and be recorded as
  # usual. Then whatever is left is cancelled, recorded as interrupted rather
  # than as a model error, and left pending for `--resume`. Only after that are
  # the clients closed and the run backed up. A second signal skips the drain.
  shutdown:
    drain_timeout_s: 300
    handle_signals: true
