dataset:
  id: cloud_opsbench
  # OFF. Switched off in this file rather than per run, so it stays off
  # without anyone having to remember a flag. Delete these two lines to
  # bring it back; nothing else about the dataset has changed.
  enabled: false
  impl: abductionbench.adapters.cloud_opsbench:CloudOpsBenchAdapter
  options:
    evidence: tool_cache      # tool_cache (bounded slice) | symptom_only
    max_evidence_entries: 6
    words_per_entry: 220
  notes: >-
    All cases with ground truth; evidence is a bounded slice of the shipped tool
    cache (the full cache/logs exceed the input budget by orders of magnitude).
