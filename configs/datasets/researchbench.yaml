dataset:
  id: researchbench
  impl: abductionbench.adapters.researchbench:ResearchBenchAdapter
  options:
    # generation (the released generation/ file) or selection (ranking/).
    # The run's modes.hypothesis_modes normally sets this: the dataset table
    # marks ResearchBench "Generation / Selection (separate tasks)", so both are
    # run as independent tasks with independent scores.
    subtask: generation
  notes: >-
    Gated Hugging Face dataset. Set HF_TOKEN to a token whose account has
    accepted the terms once at https://huggingface.co/datasets/ankilok/ResearchBench
    (gate type "auto": acceptance grants access immediately). Without that, the
    adapter reports the dataset as skipped and names the acceptance URL; a token
    alone is not enough, because repository metadata reads for any account while
    the files stay 403.
