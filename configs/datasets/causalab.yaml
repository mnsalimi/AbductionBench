dataset:
  id: causalab
  impl: abductionbench.adapters.causalab:CausaLabAdapter
  options:
    # CausaLab runs inside DiscoveryWorld, the game world its repository
    # vendors: the agent navigates to a Property Manipulator, works it through
    # dialog menus to adjust one crystal property at a time, infers the hidden
    # linear DAG from what else moves, and finally sets the Crystal Reactor to
    # the frequency that structure implies.
    #
    # It runs headless here (SDL_VIDEODRIVER=dummy) and needs pygame,
    # pathfinding and termcolor. The task prompt is NOT written by us: it is
    # the scenario's own taskDescription, which the release renders from
    # agents/recoma/prompts/reactor_task_causal_*.txt.
    #
    # Where the clone lives; the vendored discoveryworld/ comes with it.
    repo_dir: null
    # null -> every causal-graph configuration the release ships (64 of them).
    # A subset, for a quick check:  configs: [3_chain, 4_collide]
    configs: null
    # One episode per (configuration x seed).
    seeds: [1]

  notes: >-
    Runs the release's own DiscoveryWorld scenario ("Reactor Lab Causal"),
    scored by its own scorecard (score / maxScore). Replaces an earlier
    adapter that simulated the causal graphs as a linear SCM under a prompt
    written here -- a different and easier task whose numbers were not
    CausaLab's.
