dataset:
  id: scilab
  impl: abductionbench.adapters.scilab:SciLabAdapter
  options:
    # Twelve vendored NewtonBench domains x three difficulty tiers = 36
    # laboratories; each tier hides a differently modified law.
    # domains: [m0_gravity, m4_snell_law]   # subset, for a quick check
    difficulties: [easy, medium, hard]
    experiments: 12          # measurements the model may take before predicting
    questions: 5             # held-out settings it is then asked to predict
  notes: >-
    Runs the release's own NewtonBench oracles (SciLab ships laboratories, not
    items). Scored by prediction on held-out settings, so its primary metric is
    an ERROR: lower is better. The laws are deliberately not the textbook ones.
