dataset:
  id: synpat
  impl: abductionbench.adapters.synpat:SynPATAdapter
  sample_size: 300
  prompt_bindings:
    knowledge_completion: gen_structured_v1
  options:
    noise_level: "0.001"   # 0.001 | 0.01 | 0.05 | 0.1
    data_rows: 8
  notes: >-
    Items constructed from the release's replacement files plus true-system data;
    scored by SymPy equality up to a scalar factor.
