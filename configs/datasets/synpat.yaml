dataset:
  id: synpat
  # On by default; turned off for one run without touching the other 42 with
  #   ABENCH_SYNPAT=false abench run <config>
  # A run config cannot disable a single globbed dataset -- `datasets:` entries
  # are appended, not merged by id -- so the switch has to live in the dataset's
  # own file, which is also where the run configs say to put it.
  enabled: ${env:ABENCH_SYNPAT|true}
  impl: abductionbench.adapters.synpat:SynPATAdapter
  options: {}
  # No options: the release's generated .dat files are deliberately not read.
  # They are samples drawn from the very equation the model is asked for, so
  # showing them turns the task into fitting a curve to examples -- induction --
  # instead of proposing the axiom that completes the theory. The old
  # noise_level / data_rows options went with them.
  notes: >-
    Items constructed from the release's replacement files: a corrupted axiom
    system plus the quantities and their units, with no data. Scored by SymPy
    zero-set equality; only unparseable answers reach the LLM judge.
