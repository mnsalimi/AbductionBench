dataset:
  id: uniadilr_hgc
  impl: abductionbench.adapters.uniadilr_hgc:UniADILRHGcAdapter
  options: {}
  notes: >-
    The abduction split of UniADILR-HGc only (data/UniADILR-HGc/abduction.jsonl),
    and within it the two-premise items. The deduction and induction files are
    the same construction over other reasoning types and are not read. The model
    names the two statements that support the claim, as a pair of numbers, and
    they are checked as a set against the release's own `proof` field -- no
    judge.
