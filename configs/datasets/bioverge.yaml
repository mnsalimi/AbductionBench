dataset:
  id: bioverge
  impl: abductionbench.adapters.unavailable:UnavailableAdapter
  sample_size: 300
  options:
    name: "BioVerge"
    domain: "Scientific Discovery: Biomedical"
    processing_mode: "Generation & Selection"
    source_url: "https://github.com/Fuyi-Yang/BioVerge"
    reason: "evaluation items ship only inside an 11.9 GB corpus archive"
    detail: >-
      The repository contains agent code, API wrappers and prompts (42 files, no
      data). Its README points at a single Google Drive archive
      (bioverge_dataset.tar.gz) of 11.9 GB -- a biomedical literature and knowledge-
      graph corpus for the authors' retrieval agent, with no separately downloadable
      item file. Pulling 11.9 GB to extract a 300-item probe was judged out of
      proportion; the dataset is reported as skipped rather than approximated.
  notes: "Reported as skipped with a reason; see the Skipped sheet of the report."
