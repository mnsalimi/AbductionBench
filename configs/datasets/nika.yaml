dataset:
  id: nika
  impl: abductionbench.adapters.nika:NikaAdapter
  options:
    # NIKA's cases and their root-cause ground truth ship with the repository;
    # the OBSERVATIONS do not -- they exist only while the emulator is running,
    # which is the point of the benchmark. Two prerequisites are needed, and
    # this container can provide neither, and cannot be made to: `unshare -m`,
    # `unshare -U` and `unshare -n` all return EPERM, so no container runtime
    # (rootful or rootless) can even be installed, and the effective capability
    # set holds neither CAP_NET_ADMIN nor CAP_SYS_ADMIN. The kernel permits
    # namespaces; this container's seccomp/AppArmor profile does not. Only the
    # host operator can change that -- a Vast.ai VM instance would have it.
    #
    #   * a container runtime (Kathara runs one container per network device)
    #   * CAP_NET_ADMIN + network namespaces, for the virtual links
    #
    # On a host that has both:
    #   git clone https://github.com/sands-lab/nika && cd nika
    #   nika env run dc-clos-bgp
    #   nika agent run --agent <yours>        # starts the session MCP gateway
    # then point this run at it:
    #   export ABENCH_NIKA_GATEWAY_URL=http://<host>:<port>
    #   export ABENCH_NIKA_SESSION_ID=<session id>
    #
    # Without them the dataset is skipped with that requirement spelled out,
    # rather than being reported as an unavailable benchmark.
    gateway_url: ${env:ABENCH_NIKA_GATEWAY_URL|}
    session_id: ${env:ABENCH_NIKA_SESSION_ID|}
    # Where the case files live. Cloned on demand when absent.
    repo_dir: null
    # null -> the newest release directory, and its own default split.
    release: null
    split: null

  notes: >-
    Interactive network incident diagnosis through NIKA's own MCP tools, scored
    with the release's rule-based rca_f1 over {resource_id, fault_type} pairs.
    The release sets judge_allowed: false, so no judge is involved. Needs a
    reachable NIKA deployment; see options above for the exact setup.
