dataset:
  id: nika
  impl: abductionbench.adapters.unavailable:UnavailableAdapter
  options:
    name: "NIKA"
    domain: "Computing Systems: Network Troubleshooting"
    processing_mode: "Generation"
    source_url: "https://github.com/sands-lab/nika"
    reason: "requires a running network emulator"
    detail: >-
      The repository ships fault-injection specifications
      (benchmark/releases/*.yaml, benchmark/working/pool/*.yaml) and the code to
      drive an emulated network, but no recorded telemetry: an item's observations
      exist only once the emulator has been stood up, which needs privileged
      networking this container cannot provide (no kernel modules, no netns/tc).
      Unlike Cloud-OpsBench, which ships a recorded tool cache that can be replayed,
      NIKA records nothing to replay.

  notes: "Reported as skipped with a reason; see the Skipped sheet of the report."
