dataset:
  id: medups
  # OFF. Switched off in this file rather than per run, so it stays off
  # without anyone having to remember a flag. Delete these two lines to
  # bring it back; nothing else about the dataset has changed.
  enabled: false
  impl: abductionbench.adapters.medups:MedUPSAdapter
  options:
    subtask: generation   # generation (default) | selection (uses the shipped ICD distractors)
  notes: >-
    MedUPS_final_diagnosis test split (the suite's URL is a collection, resolved to
    its member datasets); mid-stream subset excluded as not abduction-only.
