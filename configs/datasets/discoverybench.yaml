dataset:
  id: discoverybench
  impl: abductionbench.adapters.unavailable:UnavailableAdapter
  options:
    name: "DiscoveryBench"
    domain: "Scientific Discovery: Data-Driven"
    processing_mode: "Generation"
    source_url: "https://github.com/allenai/discoverybench"
    reason: "gold hypotheses are withheld on every scorable split, and the task needs code execution"
    detail: >-
      Checked all four splits in the repository: real/test has 144 task files and
      synth/test 200, but their `hypotheses.main` entries are empty (0/144 and
      0/200) -- the gold hypotheses are held back for the leaderboard. Only
      real/train carries hypotheses (14 files), which is both a train split and
      too small for a 300-item probe. Separately, a DiscoveryBench hypothesis is a
      quantitative claim ("positive with linear coefficient 0.82") that is derived
      by running statistical analyses over the shipped CSVs; a text-only
      single-turn harness cannot compute it, so scores would mostly measure
      guessing. Revisit if the authors publish test hypotheses and the engine
      gains a code-execution tool.
  notes: "Reported as skipped with a reason; see the Skipped sheet of the report."
