dataset:
  id: alien_abduction_active
  impl: abductionbench.adapters.alien_abduction:AlienAbductionActiveAdapter
  options:
    test_cases: 100
    timeout_s: 10
    memory_mb: 512
  notes: >-
    Alien Abduction, Active-Output (arXiv:2608.03388), mapped to interactive
    delivery: the model picks the inputs it wants to see, 15 turns. Runs the
    release's own protocol prompt, so io only. Same 50 targets and suites as
    alien_abduction and alien_abduction_passive.
