dataset:
  id: med_inquire
  # OFF. Switched off in this file rather than per run, so it stays off
  # without anyone having to remember a flag. Delete these two lines to
  # bring it back; nothing else about the dataset has changed.
  enabled: false
  impl: abductionbench.adapters.med_inquire:MedInquireAdapter
  options:
    subtask: generation      # generation (default, per the suite's mode) | selection
    # EvoClinician's premise is that the work-up must be *requested*, so the
    # default withholds it -- which also keeps this run distinct from
    # diagnosisarena, whose items are the same 915 case reports.
    evidence: case_and_exam  # full | case_and_exam | case_only
  notes: >-
    Official test split (915 case reports); free-text diagnosis from presentation +
    examination only. Same underlying items as diagnosisarena (see its notes).
