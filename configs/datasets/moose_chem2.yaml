  # bring it back; nothing else about the dataset has changed.
  enabled: false
  impl: abductionbench.adapters.moose_chem2:MooseChem2Adapter
  # 51 papers exist; the shortfall is reported
  options:
    granularity: finegrained   # finegrained | coarse
    survey_words: 350
  notes: Repository workbook (51 papers); answer-revealing columns withheld.
