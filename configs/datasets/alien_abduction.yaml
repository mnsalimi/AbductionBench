dataset:
  id: alien_abduction
  impl: abductionbench.adapters.alien_abduction:AlienAbductionAdapter
  options:
    test_cases: 100     # per target; the Logic domain's input space caps it at 4
    timeout_s: 10       # wall clock for one submission against one suite
    memory_mb: 512      # address-space ceiling for the sandboxed candidate
  notes: >-
    Alien Abduction, Single-Turn-Output (arXiv:2608.03388), mapped to static
    delivery. The paper's code and test instances are unreleased; the 50 targets
    are rebuilt from the names and signatures of its Table 3. This mode's prompt
    is this suite's own house style, not the paper's template -- see the
    adapter's decisions.
